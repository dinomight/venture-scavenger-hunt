<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="vBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </linearGradient>

    <!-- Orange Emblem Gradient -->
    <linearGradient id="vOrange" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Gold Accent Gradient -->
    <linearGradient id="vGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Drop Shadow for Tactile Retro Pop -->
    <filter id="retroShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="2" stdDeviation="0" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Outer Black Offset Shadow Disc -->
  <circle cx="33" cy="33" r="28" fill="#000000" />

  <!-- Outer Dark Navy Badge Disc -->
  <circle cx="32" cy="32" r="28" fill="url(#vBg)" stroke="#EA580C" stroke-width="3" />

  <!-- Inner Orange Ring / Bezel -->
  <circle cx="32" cy="32" r="23.5" fill="none" stroke="url(#vGold)" stroke-width="1.5" stroke-dasharray="100" />

  <!-- Super-Science Atomic Orbit Ring -->
  <ellipse cx="32" cy="32" rx="26" ry="9" transform="rotate(-30 32 32)" fill="none" stroke="#F59E0B" stroke-width="1.8" stroke-opacity="0.85" />
  <!-- Orbit Atom Particle -->
  <circle cx="12" cy="20.5" r="2.2" fill="#FDE047" stroke="#0F172A" stroke-width="0.8" />

  <!-- Stylized Venture 'V' Shadow -->
  <path
    d="M17 14 L24 14 L32 36 L40 14 L47 14 L35.5 45 L28.5 45 Z"
    fill="#000000"
    transform="translate(1.5, 1.5)"
    opacity="0.8"
  />

  <!-- Team Venture Bold Stylized 'V' -->
  <!-- Left Wing -->
  <path
    d="M16 14 L23.5 14 L32 37 L27 45 L16 14 Z"
    fill="url(#vOrange)"
    stroke="#0F172A"
    stroke-width="1.2"
    stroke-linejoin="round"
  />
  
  <!-- Right Wing & Central Cream Inset -->
  <path
    d="M48 14 L40.5 14 L32 37 L37 45 L48 14 Z"
    fill="url(#vGold)"
    stroke="#0F172A"
    stroke-width="1.2"
    stroke-linejoin="round"
  />

  <!-- Main Crisp Cream 'V' Core -->
  <path
    d="M19 16 L24 16 L32 36 L40 16 L45 16 L34.5 43 L29.5 43 Z"
    fill="#FFFBEB"
    stroke="#0F172A"
    stroke-width="1"
    stroke-linejoin="round"
  />

  <!-- Central Speed Chevron / Divider -->
  <polygon
    points="32,20 34.5,26 32,38 29.5,26"
    fill="#EA580C"
  />
  <circle cx="32" cy="18" r="1.8" fill="#F59E0B" />
</svg>
